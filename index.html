<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Portal - Login</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .login-card {
            background-color: #ffffff;
            padding: 40px 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.05);
            width: 100%;
            max-width: 420px;
            text-align: center;
        }

        .brand-header h2 {
            font-size: 26px;
            font-weight: 700;
            color: #1a73e8;
            margin-bottom: 8px;
        }

        .brand-header p {
            font-size: 14px;
            color: #5f6368;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #3c4043;
            margin-bottom: 6px;
        }

        .form-group input {
            width: 100%;
            padding: 14px;
            border: 1px solid #dadce0;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
            transition: all 0.2s ease-in-out;
            background-color: #fafafa;
        }

        .form-group input:focus {
            border-color: #1a73e8;
            background-color: #ffffff;
            box-shadow: 0 0 0 3px rgba(26, 115, 232, 0.1);
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background-color: #1a73e8;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
            transition: background-color 0.2s;
        }

        .btn-submit:hover {
            background-color: #1557b0;
        }

        .form-footer {
            margin-top: 25px;
            font-size: 14px;
        }

        .form-footer a {
            color: #1a73e8;
            text-decoration: none;
        }

        .form-footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="brand-header">
            <h2>CloudAuth</h2>
            <p>Sign in to continue to your dashboard</p>
        </div>

        <!-- Render-এ আপলোড করার পর ব্যাকএন্ড ফাইলের নাম অনুযায়ী action পরিবর্তন করতে হবে -->
        <form action="/login" method="POST">
            <div class="form-group">
                <label for="username">Email or Username</label>
                <input type="text" id="username" name="username" placeholder="name@example.com" required autocomplete="off">
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Enter your password" required>
            </div>

            <button type="submit" class="btn-submit">Sign In</button>
        </form>

        <div class="form-footer">
            <a href="#">Forgot password?</a>
        </div>
    </div>

</body>
</html>
